[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-arbitrage-core"
version = "0.1.0a1"
description = "A deterministic offline analyzer for nominal DeFi exchange-rate cycles in local snapshots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ali Baneshi", email = "baneshi712@gmail.com"}]
maintainers = [{name = "Ali Baneshi", email = "baneshi712@gmail.com"}]
keywords = ["arbitrage", "market-analysis", "graph-algorithms", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.15", "jsonschema==4.26.0"]

[project.scripts]
defi-arbitrage-core = "arbcore.cli:main"

[project.urls]
Homepage = "https://github.com/ali-baneshi/defi-arbitrage-core"
Repository = "https://github.com/ali-baneshi/defi-arbitrage-core"
Security = "https://github.com/ali-baneshi/defi-arbitrage-core/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
